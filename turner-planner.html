<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Turner Vow Renewal Planner | REmixed Events</title>
<style>body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap">

<style>
:root{
  --canvas:#FCF9FE;
  --rail:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#FAF6FD;
  --ink:#1E1428;
  --ink-2:#615372;
  --ink-3:#95869F;
  --line:#EDE4F4;
  --line-2:#DECEEC;
  --blue:#1616F5;
  --plum:#7B2FBE;
  --violet:#8A1CEC;
  --magenta:#DC1EE3;
  --lav:#F3E9FD;
  --blush:#FDEAF6;
  --good:#0E7C57;
  --good-bg:#E4F5ED;
  --warm:#9A5B1E;
  --warm-bg:#FBEEE0;
  --soft:#7A3FA8;
  --soft-bg:#F2E8FC;
  --bad:#C22348;
  --bad-bg:#FCE8EC;
  --shadow:0 1px 2px rgba(30,20,40,.04),0 12px 30px -22px rgba(76,29,114,.35);
  --shadow-lift:0 2px 6px rgba(30,20,40,.05),0 22px 44px -28px rgba(76,29,114,.45);
  --grad:linear-gradient(135deg,#F4E9FE 0%,#FCE9F5 100%);
  --grad-ink:linear-gradient(95deg,var(--blue),var(--violet) 50%,var(--magenta));
  --sel:#F7EDFD;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#100B17;--rail:#17101F;--card:#1A1224;--card-2:#211830;
    --ink:#F7F2FB;--ink-2:#BFB1CD;--ink-3:#8F7FA0;
    --line:#2C2039;--line-2:#3D2D51;
    --blue:#8888FF;--plum:#C79BF0;--violet:#B678FF;--magenta:#FF6BF0;
    --lav:#261A35;--blush:#301B2B;
    --good:#5CD9A8;--good-bg:#0E2F26;
    --warm:#E9B978;--warm-bg:#33260F;
    --soft:#C9A2EC;--soft-bg:#271A36;
    --bad:#FF8098;--bad-bg:#3A1621;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -24px #000;
    --shadow-lift:0 2px 8px rgba(0,0,0,.5),0 26px 50px -30px #000;
    --grad:linear-gradient(135deg,#241634 0%,#2E1830 100%);
    --sel:#2A1B3A;
  }
}
:root[data-theme="dark"]{
  --canvas:#100B17;--rail:#17101F;--card:#1A1224;--card-2:#211830;
  --ink:#F7F2FB;--ink-2:#BFB1CD;--ink-3:#8F7FA0;
  --line:#2C2039;--line-2:#3D2D51;
  --blue:#8888FF;--plum:#C79BF0;--violet:#B678FF;--magenta:#FF6BF0;
  --lav:#261A35;--blush:#301B2B;
  --good:#5CD9A8;--good-bg:#0E2F26;
  --warm:#E9B978;--warm-bg:#33260F;
  --soft:#C9A2EC;--soft-bg:#271A36;
  --bad:#FF8098;--bad-bg:#3A1621;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -24px #000;
  --shadow-lift:0 2px 8px rgba(0,0,0,.5),0 26px 50px -30px #000;
  --grad:linear-gradient(135deg,#241634 0%,#2E1830 100%);
  --sel:#2A1B3A;
}
*{box-sizing:border-box}
body{
  background:var(--canvas);color:var(--ink);
  font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px;border-radius:8px}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.005em}

.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ---------- top ---------- */
.topbar{
  flex:0 0 auto;background:var(--rail);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;
}
/* Official REmixed Events wordmark — public/logo.png, never re-typeset. */
.logo{height:30px;width:auto;display:block;flex:0 0 auto;user-select:none}
.logo-hero{height:34px;width:auto;display:block;margin:0 0 18px;user-select:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo{
    background:#fff;border-radius:8px;padding:5px 9px;height:40px;
  }
  :root:not([data-theme="light"]) .logo-hero{
    background:#fff;border-radius:10px;padding:7px 12px;height:48px;
  }
}
:root[data-theme="dark"] .logo{
  background:#fff;border-radius:8px;padding:5px 9px;height:40px;
}
:root[data-theme="dark"] .logo-hero{
  background:#fff;border-radius:10px;padding:7px 12px;height:48px;
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;color:var(--ink-3);font-weight:600;font-size:14px;
  padding:7px 13px;border-radius:99px;white-space:nowrap;
}
.tab:hover{color:var(--ink-2);background:var(--card-2)}
.tab.on{color:var(--plum);background:var(--lav)}
.topright{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pillbtn{
  border:1px solid var(--line-2);background:var(--card);border-radius:99px;
  padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;
}
.pillbtn:hover{border-color:var(--violet);color:var(--plum)}
.pillbtn.go{border:0;color:#fff;background:var(--grad-ink)}
.savedot{font-size:12px;color:var(--ink-3);white-space:nowrap}
.savedot.on{color:var(--good)}

.evtline{
  flex:0 0 auto;background:var(--rail);border-bottom:1px solid var(--line);
  padding:0 20px 13px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
.evtline h1{font-family:"Instrument Serif",Georgia,serif;font-size:23px;margin:0;font-weight:400}
.evtmeta{font-size:12.5px;color:var(--ink-3)}
.prog{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}
.pbar{width:96px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--magenta));width:0;transition:width .3s}

.panes{flex:1 1 auto;display:flex;min-height:0}

/* ---------- rail ---------- */
.rail{flex:0 0 322px;border-right:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column;min-height:0}
.railtop{display:flex;gap:8px;padding:12px 14px;flex:0 0 auto}
.search{flex:1 1 auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-2);border-radius:99px;padding:7px 13px}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:13.5px}
.raillist{flex:1 1 auto;overflow-y:auto;padding:0 14px 70px}
.ghead{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;margin:18px 0 8px;padding-left:4px;
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--ink-3);
}
.ghead .caret{font-size:8px;transition:transform .16s;color:var(--ink-3)}
.ghead.closed .caret{transform:rotate(-90deg)}
.gwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.gwrap.closed{display:none}
.sec{display:flex;flex-direction:column;gap:7px;padding:12px 13px;cursor:pointer;border-left:3px solid transparent;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec:hover{background:var(--card-2)}
.sec.on{background:var(--sel);border-left-color:var(--magenta)}
.sec-t{display:flex;align-items:flex-start;gap:9px}
.sec-name{font-weight:600;font-size:14.5px;line-height:1.35;flex:1 1 auto}
.sec-time{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;color:var(--ink-3);white-space:nowrap;padding-top:3px}
.chip{
  display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;
  font-size:11px;font-weight:600;letter-spacing:.01em;width:fit-content;
}
.chip.love{background:var(--blush);color:var(--bad)}
.chip.almost{background:var(--warm-bg);color:var(--warm)}
.chip.ready{background:var(--good-bg);color:var(--good)}
.chip.dj{background:var(--soft-bg);color:var(--soft)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}

/* ---------- detail ---------- */
.detail{flex:1 1 auto;overflow-y:auto;padding:26px 34px 130px;min-width:0}
.dwrap{max-width:680px}
.back{display:none;margin-bottom:16px}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.dhead h2{font-family:"Instrument Serif",Georgia,serif;font-size:34px;font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.dtitle{
  font-family:"Instrument Serif",Georgia,serif;font-size:34px;line-height:1.1;
  border:1px solid transparent;background:transparent;border-radius:10px;
  padding:2px 8px;margin-left:-8px;flex:1 1 260px;min-width:0;
}
.dtitle:hover{border-color:var(--line)}
.dtitle:focus{border-color:var(--violet);background:var(--card);outline:0}
.dmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.dtimein{
  font-family:"DM Mono",ui-monospace,monospace;font-size:12px;
  border:1px solid var(--line-2);border-radius:99px;padding:5px 13px;
  background:var(--card);width:130px;
}
.dtimein:focus{border-color:var(--violet);outline:0}
.btn.danger{border-color:var(--line-2);color:var(--ink-3)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.ddesc-edit{
  width:100%;border:1px solid transparent;background:transparent;color:var(--ink-2);
  font:inherit;font-size:15px;line-height:1.55;border-radius:10px;padding:4px 8px;
  margin:0 0 8px -8px;resize:none;overflow:hidden;
}
.ddesc-edit:hover{border-color:var(--line)}
.ddesc-edit:focus{border-color:var(--violet);background:var(--card);outline:0}
.gcount{margin-left:auto;font-size:10px;opacity:.6}
.addsec{width:100%;margin:16px 0 0;border-style:dashed}
.addgrouphead{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--plum);margin:18px 0 8px;
}
.addwrap{display:flex;flex-direction:column;gap:7px}
.addchip{
  border:1px solid var(--line-2);background:var(--card);border-radius:12px;
  padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;
}
.addchip:hover{border-color:var(--violet);background:var(--card-2)}
.addchip .an{font-weight:600;font-size:14.5px}
.addchip .ad{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.dtime{font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:99px;padding:4px 11px;background:var(--card)}
.ddesc{color:var(--ink-2);font-size:15px;margin:0 0 8px;max-width:60ch}
.warm{
  font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:17px;
  color:var(--plum);margin:0 0 22px;max-width:56ch;line-height:1.45;
}
.block{margin:0 0 30px}
.bhead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.bhead h3{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--plum);margin:0}
.bhead .c{font-size:12px;color:var(--ink-3)}

/* welcome */
.hero{background:var(--grad);border-radius:24px;padding:34px 32px;margin:0 0 26px;border:1px solid var(--line)}
.hero h2{font-family:"Instrument Serif",Georgia,serif;font-size:42px;margin:0 0 10px;font-weight:400;line-height:1.05;text-wrap:balance}
.hero p{color:var(--ink-2);font-size:16px;margin:0;max-width:52ch;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:14px;margin:0 0 26px}
.bigcard{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;
  box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:7px;
  transition:transform .14s,box-shadow .14s,border-color .14s;
}
.bigcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.bigcard .k{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta)}
.bigcard .h{font-family:"Instrument Serif",Georgia,serif;font-size:23px;line-height:1.15}
.bigcard .s{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.bigcard .chip{margin-top:6px}

/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin:0 0 9px;box-shadow:var(--shadow)}
.q.answered{border-color:var(--line-2);background:var(--card-2)}
.q label{display:block;font-weight:600;font-size:15px;margin:0 0 4px;line-height:1.4}
.q .hint{display:block;font-weight:400;color:var(--ink-3);font-size:13px;margin:3px 0 9px;font-style:italic}
.q input[type=text],.q textarea{
  width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;font-size:14.5px;resize:vertical;line-height:1.55;margin-top:6px;
}
.q input[type=text]:focus,.q textarea:focus{border-color:var(--violet);outline:0;background:var(--card)}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.opt{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:7px 15px;font-size:13.5px;color:var(--ink-2)}
.opt:hover{border-color:var(--violet)}
.opt.on{background:var(--grad-ink);border-color:transparent;color:#fff;font-weight:600}

/* songs */
.song{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 9px;box-shadow:var(--shadow)}
.song.dnp{background:var(--bad-bg);border-color:var(--line-2)}
.srow{display:flex;align-items:center;gap:10px}
.snum{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;color:var(--ink-3);flex:0 0 auto;min-width:14px}
.sf{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.song input{border:0;background:transparent;outline:0;width:100%;padding:2px 0}
.sti{font-size:15px;font-weight:600}
.sar{font-size:13px;color:var(--ink-2)}
.song input::placeholder{color:var(--ink-3);font-weight:400}
.more{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.more:hover{border-color:var(--violet);color:var(--plum)}
.x{border:0;background:transparent;color:var(--ink-3);border-radius:8px;width:28px;height:28px;flex:0 0 auto;font-size:16px}
.x:hover{background:var(--card-2);color:var(--bad)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-left:24px}
.tag{font-size:10.5px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--card-2);color:var(--ink-3);border:1px solid var(--line)}
.tag.must{background:var(--good-bg);color:var(--good);border-color:transparent}
.tag.maybe{background:var(--soft-bg);color:var(--soft);border-color:transparent}
.tag.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.st{background:var(--warm-bg);color:var(--warm);border-color:transparent}
.sdet{display:none;margin-top:12px;padding:13px 0 2px 24px;border-top:1px solid var(--line);gap:12px;flex-direction:column}
.sdet.open{display:flex}
.fld{display:flex;flex-direction:column;gap:5px}
.fld > span{font-family:"DM Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.fld select,.fld input[type=text],.fld textarea{
  background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;width:100%;
}
.fld select:focus,.fld input:focus,.fld textarea:focus{border-color:var(--violet);outline:0}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnks{display:flex;gap:6px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);text-decoration:none;background:var(--card)}
.lnk:hover{border-color:var(--violet);color:var(--plum)}

.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:9px 17px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--violet);color:var(--plum)}
.btn.go{border:0;color:#fff;background:var(--grad-ink)}
.btn.sm{padding:6px 13px;font-size:12.5px}

/* paste */
.pastebox{background:var(--grad);border:1px solid var(--line-2);border-radius:20px;padding:20px;margin:0 0 12px}
.pastebox h4{font-family:"Instrument Serif",Georgia,serif;font-size:24px;margin:0 0 5px;font-weight:400}
.pastebox p{font-size:13.5px;color:var(--ink-2);margin:0 0 13px;max-width:52ch}
.pastebox textarea{
  width:100%;min-height:150px;background:var(--card);border:1px solid var(--line-2);
  border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.6;resize:vertical;
}
.pastebox textarea:focus{border-color:var(--violet);outline:0}
.prow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.prow .fld{flex:1 1 160px}

.notewrap textarea{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;font-size:14.5px;min-height:84px;line-height:1.6;box-shadow:var(--shadow);
}
.notewrap textarea:focus{border-color:var(--violet);outline:0}
.djnote{border-style:dashed !important;background:var(--card-2) !important;margin-top:9px}

.hintbar{background:var(--lav);border-radius:14px;padding:13px 16px;font-size:14px;color:var(--ink-2);margin:0 0 20px;line-height:1.55}
.hintbar b{color:var(--ink)}

.person{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:0 0 9px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.person .f{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;min-width:0}
.person input{border:0;background:transparent;outline:0;width:100%}
.person .role{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.person .nm{font-size:15px;font-weight:600}
.person .ct{font-size:13px;color:var(--ink-2)}

/* review */
.rev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;margin:0 0 12px;box-shadow:var(--shadow)}
.rev h4{font-family:"Instrument Serif",Georgia,serif;font-size:22px;margin:0 0 3px;font-weight:400}
.rev .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 11px}
.rev ul{margin:0;padding-left:19px}
.rev li{margin:0 0 5px;font-size:14px}
.rev .none{font-size:13.5px;color:var(--ink-3);font-style:italic}
.revline{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.revline:last-child{border-bottom:0}
.revline .t{font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;color:var(--ink-3);flex:0 0 66px}
.revline .n{flex:1 1 auto}
.revline .s{color:var(--ink-2);font-size:13px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,18,44,.5);display:none;z-index:99;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:22px;max-width:640px;width:100%;max-height:84vh;overflow:auto;padding:26px 28px;box-shadow:0 40px 90px -25px rgba(0,0,0,.55)}
.sheet h3{font-family:"Instrument Serif",Georgia,serif;font-size:27px;margin:0 0 8px;font-weight:400}
.sheet > p{color:var(--ink-2);font-size:14.5px;margin:0 0 16px;line-height:1.6}
.sheet pre{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:"DM Mono",ui-monospace,monospace;font-size:12px;white-space:pre-wrap;max-height:320px;overflow:auto;line-height:1.6}

@media (max-width:880px){
  .rail{flex:1 1 auto;border-right:0}
  .detail{display:none}
  body.dv .rail{display:none}
  body.dv .detail{display:block;flex:1 1 auto}
  .back{display:inline-flex}
  .detail{padding:18px 18px 130px}
  .dhead h2{font-size:28px}
  .hero{padding:26px 22px;border-radius:20px}
  .hero h2{font-size:33px}
  .prog{width:100%;margin-left:0}
  .fld2{grid-template-columns:1fr}
}
@media print{
  .topbar,.rail,.back,.pillbtn,.btn,.x,.more,.pastebox{display:none !important}
  .app{height:auto;overflow:visible}
  .detail{display:block !important;overflow:visible;padding:0}
  body{background:#fff}
  .sdet{display:flex !important}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

<script>
/* ===================================================================
   REmixed Events — Turner Vow Renewal planning lounge
   Left: grouped section rail. Right: editable planning detail.
   Saves to this device. "Send to ReRe" hands it back.
   =================================================================== */

var KEY = "remixed.turner.v4";

/* ReRe's private mode. Off for everybody by default — the client never sees
   a DJ-only section, ReRe's booth view, or her private notes.
   Turn it on by triple-clicking the logo (works inside any embed), or with
   #dj on the URL when the page is hosted directly. It sticks to the device. */
var DJ_KEY = "remixed.turner.djmode";
var IS_DJ = /[?&#]dj\b/i.test(location.href);
try{
  if(/[?&#]client\b/i.test(location.href)){ localStorage.removeItem(DJ_KEY); IS_DJ=false; }
  else if(IS_DJ){ localStorage.setItem(DJ_KEY,"1"); }
  else if(localStorage.getItem(DJ_KEY)==="1"){ IS_DJ=true; }
}catch(e){}

function toggleDJ(){
  IS_DJ = !IS_DJ;
  try{
    if(IS_DJ) localStorage.setItem(DJ_KEY,"1");
    else localStorage.removeItem(DJ_KEY);
  }catch(e){}
  document.getElementById("btnDJ").style.display = IS_DJ ? "" : "none";
  view = "plan"; current = 0;
  renderTabs(); renderRail(); renderDetail(); progress();

function makeSection(spec){
  var songs=[];
  var slots=spec.slots||0;
  if(slots){
    var n=slots===1?1:Math.min(slots,3);
    for(var z=0;z<n;z++) songs.push(newSong(spec.prio));
  }
  return {
    id:(spec.name||"section").toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,28)+"-"+Math.random().toString(36).slice(2,6),
    group:spec.group||"Final Details", name:spec.name||"New section",
    time:spec.time||"", djOnly:!!spec.djOnly, desc:spec.desc||"", warm:spec.warm||"",
    slots:slots, prio:spec.prio||"Play If Possible", paste:false, songs:songs,
    questions:(spec.q||[]).map(function(x){
      return {q:x.q,hint:x.hint||"",type:x.type||"text",opts:x.opts||null,a:""};
    }),
    note:"", djNote:"", custom:!spec.name
  };
}

function newSong(prio){
  return {t:"",a:"",link:"",src:"",moment:"",prio:prio||"Play If Possible",note:"",status:"Needs review"};
}

var view="welcome";            /* welcome | plan | review | people */

/* Collapse state reads through `state` every time — no alias to fall out of sync. */
function CL(){ if(!state.closed) state.closed={}; return state.closed; }
var filter="";

/* Everything below respects DJ mode: the client never sees a DJ-only section. */
function visible(){
  return state.sections.filter(function(s){ return IS_DJ || !s.djOnly; });
}
function visibleGroups(){
  return GROUPS.filter(function(g){ return IS_DJ || g!=="DJ Only"; });

/* ---------- helpers ---------- */
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
function grow(ta){ ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; }
function done(q){ return String(q.a||"").trim().length>0; }
function filled(s){ return s.songs.filter(function(x){ return (x.t||"").trim(); }).length; }
function ans(s){ return s.questions.filter(done).length; }

function secState(s){
  if(s.djOnly) return "dj";
  var need=s.questions.length + (s.slots>0?1:0);
  if(s.paste) need=0;
  var got=ans(s) + (s.slots>0 && filled(s)>0 ? 1:0);
  if(need===0) return (s.note||"").trim()||filled(s) ? "ready":"love";
  if(got===0) return "love";
  if(got>=need) return "ready";
  return "almost";
}
var CHIP={love:"Needs love",almost:"Almost there",ready:"Ready for ReRe",dj:"DJ review"};
function chipFor(s){
  var k=secState(s);
  var c=el("span","chip "+k);
  c.appendChild(el("span","d"));
  c.appendChild(el("span",null,CHIP[k]));
  return c;
}

function progress(){
  var need=0,got=0;
  state.sections.forEach(function(s){
    if(s.djOnly||s.paste) return;
    s.questions.forEach(function(q){ need++; if(done(q)) got++; });
    if(s.slots>0){ need++; if(filled(s)>0) got++; }
  });
  var pct=need?Math.round(got/need*100):0;
  document.getElementById("pbar").style.width=pct+"%";
  document.getElementById("ptxt").textContent=pct+"% together";
}

/* ---------- rail ---------- */
function renderRail(){
  var host=document.getElementById("rail");
  host.textContent="";
  var f=filter.toLowerCase().trim();
  visibleGroups().forEach(function(g){
    var items=visible().filter(function(s){
      if(s.group!==g) return false;
      if(!f) return true;
      return (s.name+" "+s.desc).toLowerCase().indexOf(f)>=0;
    });
    if(!items.length) return;
    var head=el("div","ghead"+(CL()[g]?" closed":""));
    head.appendChild(el("span","caret","▼"));
    head.appendChild(el("span",null,g));
    head.appendChild(el("span","gcount",String(items.length)));
    head.addEventListener("click",function(){
      CL()[g]=!CL()[g]; save(); renderRail();
    });
    host.appendChild(head);

    var wrap=el("div","gwrap"+(CL()[g]?" closed":""));
    items.forEach(function(s){
      var i=state.sections.indexOf(s);
      var row=el("div","sec"+(i===current&&view==="plan"?" on":""));
      var t=el("div","sec-t");
      t.appendChild(el("div","sec-name",s.name));
      if(s.time) t.appendChild(el("div","sec-time",s.time));
      row.appendChild(t);
      row.appendChild(chipFor(s));
      row.addEventListener("click",function(){
        current=i; view="plan";
        document.body.classList.add("dv");
        renderTabs(); renderRail(); renderDetail();
        document.getElementById("detail").scrollTop=0;
      });
      wrap.appendChild(row);
    });
    host.appendChild(wrap);
  });

  var addBtn=el("button","btn sm addsec","+ Add a section");
  addBtn.addEventListener("click",openAddSection);
  host.appendChild(addBtn);
}

/* ---------- add / remove sections ---------- */
function openAddSection(){
  var host=document.getElementById("mBody");
  document.getElementById("mTitle").textContent="Add a section";
  document.getElementById("mDesc").textContent=
    "Anything missing from your day — put it back. Removed sections live here too, so nothing is ever lost.";
  host.style.display="";
  host.textContent="";
  host.style.whiteSpace="normal";
  host.style.fontFamily="inherit";
  host.style.fontSize="14px";

  var have={};
  state.sections.forEach(function(s){ have[s.name]=true; });

  var blank=el("button","btn go","+ Blank section");
  blank.style.marginBottom="14px";
  blank.addEventListener("click",function(){
    var s=makeSection({group:"Final Details",name:"New section",slots:2,
      desc:"Tell me what happens here."});
    state.sections.push(s);
    current=state.sections.indexOf(s); view="plan";
    save(); modal.classList.remove("open");
    renderTabs(); renderRail(); renderDetail(); progress();
  });
  host.appendChild(blank);

  var lib=LIBRARY().filter(function(x){ return !have[x.name]; });
  var byGroup={};
  lib.forEach(function(x){ (byGroup[x.group]=byGroup[x.group]||[]).push(x); });
  if(!lib.length) host.appendChild(el("p","none","Everything from the library is already in your plan."));

  GROUPS.forEach(function(g){
    if(!byGroup[g]) return;
    var h=el("div","addgrouphead",g);
    host.appendChild(h);
    var wrap=el("div","addwrap");
    byGroup[g].forEach(function(spec){
      var b=el("button","addchip");
      b.appendChild(el("span","an",spec.name));
      if(spec.desc) b.appendChild(el("span","ad",spec.desc));
      b.addEventListener("click",function(){
        var s=makeSection(spec);
        /* drop it next to its group-mates so the order still reads like the night */
        var last=-1;
        state.sections.forEach(function(x,i){ if(x.group===s.group) last=i; });
        if(last>=0) state.sections.splice(last+1,0,s); else state.sections.push(s);
        current=state.sections.indexOf(s); view="plan";
        CL()[s.group]=false;
        save(); modal.classList.remove("open");
        renderTabs(); renderRail(); renderDetail(); progress();
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  });
  modal.classList.add("open");
}

function removeSection(i){
  var s=state.sections[i];
  if(!confirm("Remove “"+s.name+"” from the plan?\n\nYou can always add it back from “+ Add a section”.")) return;
  state.sections.splice(i,1);
  if(current>=state.sections.length) current=Math.max(0,state.sections.length-1);
  save(); renderRail(); renderDetail(); progress();
}

function momentNames(){

function detectSrc(url){
  url=(url||"").toLowerCase();
  if(url.indexOf("spotify")>=0) return "Spotify";
  if(url.indexOf("music.apple")>=0||url.indexOf("itunes.apple")>=0) return "Apple Music";
  if(url.indexOf("youtu")>=0) return "YouTube";
  if(url.indexOf("tidal")>=0) return "Tidal";
  if(url.indexOf("soundcloud")>=0) return "SoundCloud";
  return url?"Other":"";
}
function sel(label,opts,val,on){
  var f=el("label","fld");
  f.appendChild(el("span",null,label));
  var s=document.createElement("select");
  opts.forEach(function(o){
    var op=document.createElement("option");
    op.value=o; op.textContent=o||"—";
    if(o===val) op.selected=true;
    s.appendChild(op);
  });
  s.addEventListener("change",function(){ on(s.value); });
  f.appendChild(s);
  return f;
}

function songRow(list,i,after){
  var s=list[i];
  var box=el("div","song"+(s.prio==="Do Not Play"?" dnp":""));

  var r=el("div","srow");
  r.appendChild(el("span","snum",String(i+1)));
  var f=el("div","sf");
  var ti=document.createElement("input"); ti.className="sti"; ti.value=s.t||""; ti.placeholder="Song title";
  var ar=document.createElement("input"); ar.className="sar"; ar.value=s.a||""; ar.placeholder="Artist";
  f.appendChild(ti); f.appendChild(ar);
  r.appendChild(f);

  var moreBtn=el("button","more","Details");
  r.appendChild(moreBtn);
  var del=el("button","x","×");
  del.title="Remove";
  del.addEventListener("click",function(){ list.splice(i,1); save(); renderDetail(); renderRail(); progress(); });
  r.appendChild(del);
  box.appendChild(r);

  var tags=el("div","tagrow");
  box.appendChild(tags);
  function paintTags(){
    tags.textContent="";
    var p=el("span","tag "+(s.prio==="Must Play"?"must":s.prio==="Do Not Play"?"no":"maybe"),s.prio);
    tags.appendChild(p);
    if(s.status && s.status!=="Needs review") tags.appendChild(el("span","tag st",s.status));
    if(s.src) tags.appendChild(el("span","tag",s.src));
    if(s.moment) tags.appendChild(el("span","tag",s.moment));
    if((s.note||"").trim()) tags.appendChild(el("span","tag","note"));
    box.classList.toggle("dnp",s.prio==="Do Not Play");
  }

  var det=el("div","sdet");
  var linkF=el("label","fld");
  linkF.appendChild(el("span",null,"Link"));
  var link=document.createElement("input"); link.type="text"; link.value=s.link||"";
  link.placeholder="Paste a Spotify, Apple Music, YouTube, Tidal or SoundCloud link";
  linkF.appendChild(link);
  det.appendChild(linkF);

  var lnks=el("div","lnks");
  det.appendChild(lnks);
  function paintLinks(){
    lnks.textContent="";
    var query=encodeURIComponent(((s.t||"")+" "+(s.a||"")).trim());
    if((s.link||"").trim()){
      var o=el("a","lnk","Open link"); o.href=s.link; o.target="_blank"; o.rel="noopener";
      lnks.appendChild(o);
    }
    if(!(s.t||"").trim()) return;
    [["Spotify","https://open.spotify.com/search/"],
     ["Apple","https://music.apple.com/us/search?term="],
     ["YouTube","https://www.youtube.com/results?search_query="],
     ["Tidal","https://listen.tidal.com/search?q="],
     ["SoundCloud","https://soundcloud.com/search?q="]].forEach(function(p){
      var a=el("a","lnk","Find on "+p[0]);
      a.href=p[1]+query; a.target="_blank"; a.rel="noopener";
      lnks.appendChild(a);
    });
  }

  var g1=el("div","fld2");
  g1.appendChild(sel("Source",SOURCES,s.src,function(v){ s.src=v; save(); paintTags(); }));
  g1.appendChild(sel("Moment",momentNames(),s.moment,function(v){ s.moment=v; save(); paintTags(); }));
  det.appendChild(g1);

  var g2=el("div","fld2");
  g2.appendChild(sel("Priority",PRIOS,s.prio,function(v){ s.prio=v; save(); paintTags(); renderRail(); }));
  g2.appendChild(sel("Status",STATUSES,s.status,function(v){ s.status=v; save(); paintTags(); }));
  det.appendChild(g2);

  var nf=el("label","fld");
  nf.appendChild(el("span",null,"Notes"));
  var nt=document.createElement("textarea"); nt.rows=2; nt.value=s.note||"";
  nt.placeholder="“Play the live version.” “This was our wedding song.”";
  nt.addEventListener("input",function(){ s.note=nt.value; grow(nt); save(); paintTags(); });
  nf.appendChild(nt);
  det.appendChild(nf);
  box.appendChild(det);

  moreBtn.addEventListener("click",function(){
    det.classList.toggle("open");
    moreBtn.textContent=det.classList.contains("open")?"Hide":"Details";
    if(det.classList.contains("open")){ paintLinks(); grow(nt); }
  });

  ti.addEventListener("input",function(){ s.t=ti.value; save(); paintLinks(); if(after) after(); });
  ar.addEventListener("input",function(){ s.a=ar.value; save(); paintLinks(); });
  link.addEventListener("input",function(){
    s.link=link.value;
    if(!s.src||s.src==="Other") s.src=detectSrc(s.link);
    save(); paintTags(); paintLinks();
  });

  paintTags();
  return box;
}

/* ---------- paste ---------- */
function parseList(text,prioDefault){
  var out=[];
  text.split(/\r?\n/).forEach(function(ln){
    ln=ln.trim();
    if(!ln) return;
    var song=newSong(prioDefault);
    var m=ln.match(/https?:\/\/\S+/);
    if(m){
      song.link=m[0];
      song.src=detectSrc(m[0]);
      ln=ln.replace(m[0],"").trim().replace(/^[-–—•*\d.\)\s]+/,"");
    }
    ln=ln.replace(/^\s*\d+[\.\)]\s*/,"").replace(/^[-–—•*]\s*/,"");
    if(ln){
      var parts=ln.split(/\s+[-–—]\s+|\s+by\s+/i);
      song.t=(parts[0]||"").trim();
      song.a=(parts[1]||"").trim();
    }
    if(song.t||song.link) out.push(song);
  });
  return out;
}

function pasteBlock(host){
  var box=el("div","pastebox");
  box.appendChild(el("h4",null,"Paste playlist here"));
  box.appendChild(el("p",null,"Paste anything — links, song titles, artists, or a messy list. ReRe can clean it up."));
  var ta=document.createElement("textarea");
  ta.placeholder="Before I Let Go - Frankie Beverly & Maze\nAt Last — Etta James\nhttps://open.spotify.com/track/...\n\nStraight from your Notes app is fine. Messy is fine.";
  box.appendChild(ta);

  var row=el("div","prow");
  var prio="Must Play", moment="";
  row.appendChild(sel("Add these as",PRIOS,prio,function(v){ prio=v; }));
  row.appendChild(sel("Put them in",momentNames(),moment,function(v){ moment=v; }));
  var add=el("button","btn go","Add to my plan");
  row.appendChild(add);
  box.appendChild(row);

  var res=el("p");
  res.style.cssText="font-size:13.5px;color:var(--ink-2);margin:10px 0 0";
  box.appendChild(res);

  add.addEventListener("click",function(){
    var songs=parseList(ta.value,prio);
    if(!songs.length){ res.textContent="Nothing to add yet — paste your list above first."; return; }
    var target=null;
    if(moment) target=state.sections.filter(function(s){ return s.name===moment; })[0];
    if(!target){
      target=state.sections.filter(function(s){
        return s.name===(prio==="Do Not Play"?"Songs we won't play":"Must-play songs");
      })[0];
    }
    songs.forEach(function(x){ if(moment) x.moment=moment; target.songs.push(x); });
    ta.value="";
    save(); renderRail(); progress();
    res.textContent="Added "+songs.length+" song"+(songs.length===1?"":"s")+" to “"+target.name+"”. Thank you — I've got it from here.";
  });
  host.appendChild(box);
}

    {k:"Anytime",h:"Tell us the vibe",s:"How your wedding should feel, how I should sound. This helps me read the room.",go:"Tell us the vibe of your wedding"},

    b.appendChild(el("span","h",c.h));

    var tgt=state.sections.filter(function(s){ return s.name===c.go; })[0];
    if(tgt) b.appendChild(chipFor(tgt));
    b.addEventListener("click",function(){
      var i=state.sections.indexOf(tgt);
      if(i>=0){ current=i; }
      view="plan";
      document.body.classList.add("dv");
      renderTabs(); renderRail(); renderDetail();
      document.getElementById("detail").scrollTop=0;
    });
    cards.appendChild(b);
  });

  host.appendChild(hb);

  pasteBlock(host);
}

/* ---------- detail ---------- */
function renderDetail(){
  var host=document.getElementById("dwrap");
  host.textContent="";
  var back=el("button","btn sm back","‹ All sections");
  back.addEventListener("click",function(){ document.body.classList.remove("dv"); });
  host.appendChild(back);

  if(view==="welcome") return renderWelcome(host);
  if(view==="review")  return renderReview(host);
  if(view==="people")  return renderPeople(host);

  var s=state.sections[current];
  if(!s) return;

  var h=el("div","dhead");
  var nameIn=document.createElement("input");
  nameIn.className="dtitle"; nameIn.value=s.name; nameIn.placeholder="Name this moment";
  nameIn.setAttribute("aria-label","Section name");
  nameIn.addEventListener("input",function(){ s.name=nameIn.value; save(); renderRail(); });
  h.appendChild(nameIn);
  h.appendChild(chipFor(s));
  host.appendChild(h);

  var meta=el("div","dmeta");
  var timeIn=document.createElement("input");
  timeIn.className="dtimein"; timeIn.value=s.time||""; timeIn.placeholder="Add a time";
  timeIn.setAttribute("aria-label","Start time");
  timeIn.addEventListener("input",function(){ s.time=timeIn.value; save(); renderRail(); });
  meta.appendChild(timeIn);
  var rm=el("button","btn sm danger","Remove this section");
  rm.addEventListener("click",function(){ removeSection(current); });
  meta.appendChild(rm);
  host.appendChild(meta);

  if(s.desc){
    var dd=document.createElement("textarea");
    dd.className="ddesc-edit"; dd.rows=1; dd.value=s.desc;
    dd.addEventListener("input",function(){ s.desc=dd.value; grow(dd); save(); renderRail(); });
    host.appendChild(dd);
    requestAnimationFrame(function(){ grow(dd); });
  }
  if(s.warm) host.appendChild(el("p","warm",s.warm));

  if(s.paste){ pasteBlock(host); }

  if(s.questions.length){
    var qb=el("div","block");
    var qh=el("div","bhead");
    qh.appendChild(el("h3",null,"A few questions"));
    qh.appendChild(el("span","c",ans(s)+" of "+s.questions.length+" answered · no pressure"));
    qb.appendChild(qh);
    s.questions.forEach(function(q){
      var card=el("div","q"+(done(q)?" answered":""));
      var lab=el("label",null,q.q);
      if(q.hint) lab.appendChild(el("span","hint",q.hint));
      card.appendChild(lab);
      if(q.type==="choice"){
        var w=el("div","opts");
        q.opts.forEach(function(o){
          var b=el("button","opt"+(q.a===o?" on":""),o);
          b.addEventListener("click",function(){
            q.a=(q.a===o)?"":o; save(); renderDetail(); renderRail(); progress();
          });
          w.appendChild(b);
        });
        card.appendChild(w);
      }else if(q.type==="long"){
        var ta=document.createElement("textarea"); ta.rows=2; ta.value=q.a||"";
        ta.addEventListener("input",function(){
          q.a=ta.value; grow(ta); save();
          card.classList.toggle("answered",done(q));
          renderRail(); progress();
        });
        card.appendChild(ta);
        requestAnimationFrame(function(){ grow(ta); });
      }else{
        var inp=document.createElement("input"); inp.type="text"; inp.value=q.a||"";
        inp.addEventListener("input",function(){
          q.a=inp.value; save();
          card.classList.toggle("answered",done(q));
          renderRail(); progress();
        });
        card.appendChild(inp);
      }
      qb.appendChild(card);
    });
    host.appendChild(qb);
  }

  if(s.slots>0){
    var sb=el("div","block");
    var sh=el("div","bhead");
    sh.appendChild(el("h3",null,s.slots===1?"The song":"Songs"));
    sh.appendChild(el("span","c",filled(s)+" added"+(s.slots>1?" · room for about "+s.slots:"")));
    sb.appendChild(sh);
    var lh=el("div");
    s.songs.forEach(function(_,i){ lh.appendChild(songRow(s.songs,i,function(){ renderRail(); progress(); })); });
    sb.appendChild(lh);
    var rb=el("div","rowbtns");
    var add=el("button","btn sm","+ Add another");
    add.addEventListener("click",function(){ s.songs.push(newSong(s.prio)); save(); renderDetail(); });
    rb.appendChild(add);
    sb.appendChild(rb);
    host.appendChild(sb);
  }

  var nb=el("div","block notewrap");
  var nh=el("div","bhead");
  nh.appendChild(el("h3",null,"Anything else"));
  nb.appendChild(nh);
  var nta=document.createElement("textarea");
  nta.placeholder="Type freely. Nothing is too small.";
  nta.value=s.note||"";
  nta.addEventListener("input",function(){ s.note=nta.value; grow(nta); save(); renderRail(); });
  nb.appendChild(nta);
  requestAnimationFrame(function(){ grow(nta); });

  if(IS_DJ){
    var dn=document.createElement("textarea");
    dn.className="djnote";
    dn.placeholder="ReRe’s private notes — only visible on your #dj link.";
    dn.value=s.djNote||"";
    dn.addEventListener("input",function(){ s.djNote=dn.value; grow(dn); save(); });
    nb.appendChild(dn);
    requestAnimationFrame(function(){ grow(dn); });
  }
  host.appendChild(nb);
}

/* ---------- review ---------- */
function allSongs(){
  var out=[];
  visible().forEach(function(s){
    s.songs.forEach(function(x){ if((x.t||"").trim()||(x.link||"").trim()) out.push({s:s,x:x}); });
  });
  return out;
}
function revCard(title,sub,fill){
  var c=el("div","rev");
  c.appendChild(el("h4",null,title));
  if(sub) c.appendChild(el("p","sub",sub));
  fill(c);
  return c;
}

  host.appendChild(revCard("Notes for ReRe","Everything you wrote in the margins.",function(c){

/* ---------- text export ---------- */
function planText(dj){
  var L=[];
  L.push(state.event.name.toUpperCase());
  L.push(state.event.meta);
  L.push("DJ ReRe · REmixed Events · 786-910-2799 · info@remixedeventsllc.com");
  state.sections.forEach(function(s){
    if(s.djOnly&&!dj) return;
    if(s.paste) return;
    var bits=[];
    s.questions.forEach(function(q){ if(done(q)) bits.push("  "+q.q+" → "+q.a); });
    s.songs.forEach(function(x){
      if(!(x.t||"").trim()&&!(x.link||"").trim()) return;
      var line="  * "+(x.t||"(link only)")+(x.a?" — "+x.a:"")+"  ["+x.prio+"]";
      if(dj&&x.status&&x.status!=="Needs review") line+=" ["+x.status+"]";
      if(x.src) line+=" ("+x.src+")";
      bits.push(line);
      if((x.link||"").trim()) bits.push("      "+x.link);
      if((x.note||"").trim()) bits.push("      note: "+x.note.trim());
    });
    if((s.note||"").trim()) bits.push("  Note: "+s.note.trim());
    if(dj&&(s.djNote||"").trim()) bits.push("  DJ: "+s.djNote.trim());
    if(dj){
      s.questions.forEach(function(q){ if(!done(q)) bits.push("  ? unanswered: "+q.q); });
    }
    if(!bits.length) return;
    L.push("");
    L.push((s.time?s.time+"  ":"")+s.name.toUpperCase());
    L.push(bits.join("\n"));
  });
  var pp=state.people.filter(function(p){ return (p.name||"").trim()||(p.contact||"").trim(); });
  if(pp.length){
    L.push(""); L.push("PEOPLE");
    pp.forEach(function(p){ L.push("  "+(p.role||"—")+": "+(p.name||"")+(p.contact?" · "+p.contact:"")); });
  }
  return L.join("\n");
}

/* ---------- modal ---------- */
var modal=document.getElementById("modal");
function openModal(title,desc,body){
  document.getElementById("mTitle").textContent=title;
  document.getElementById("mDesc").textContent=desc;
  var pre=document.getElementById("mBody");
  pre.textContent=body||"";
  pre.style.display=body?"":"none";
  modal.classList.add("open");
}
document.getElementById("mClose").addEventListener("click",function(){ modal.classList.remove("open"); });
modal.addEventListener("click",function(e){ if(e.target===modal) modal.classList.remove("open"); });
function copyText(txt,btn,label){
  var ok=function(){ btn.textContent="Copied"; setTimeout(function(){ btn.textContent=label; },1600); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,function(){ legacy(txt,ok); });
  } else legacy(txt,ok);
}
function legacy(txt,ok){
  var ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){}
  document.body.removeChild(ta);
}
document.getElementById("mCopy").addEventListener("click",function(){
  copyText(document.getElementById("mBody").textContent,this,"Copy");
});
document.getElementById("mMail").addEventListener("click",function(){
  var b=this, txt=document.getElementById("mBody").textContent;
  copyText(txt,b,"Email it to ReRe");
  var url="mailto:info@remixedeventsllc.com?subject="
    +encodeURIComponent(state.event.name+" — our planning notes")
    +"&body="+encodeURIComponent("Hi ReRe — here's where we landed:\n\n(paste below)\n\n");
  window.open(url,"_blank");
});
